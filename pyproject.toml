[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextsync"
version = "0.2.0"
description = "Lightweight GTK synchronization client for Nextcloud powered by nextcloudcmd"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "gnacho"}]
keywords = ["nextcloud", "sync", "gtk4", "libadwaita", "gnome"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
nextsync = "nextsync.__main__:main"

[project.urls]
Homepage = "https://github.com/gnacho/nextsync"
Repository = "https://github.com/gnacho/nextsync"
Issues = "https://github.com/gnacho/nextsync/issues"
Changelog = "https://github.com/gnacho/nextsync/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
